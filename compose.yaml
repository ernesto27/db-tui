name: db-tui

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: chinook
      POSTGRES_USER: db_tui
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U db_tui -d chinook"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s

  postgres-pagila:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pagila
      POSTGRES_USER: db_tui
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - pagila-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/pagila.sql:/docker-entrypoint-initdb.d/001_pagila.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U db_tui -d pagila"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: world
      MYSQL_USER: db_tui
      MYSQL_PASSWORD: db_tui
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u db_tui -pdb_tui"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 10s

volumes:
  postgres-data:
  pagila-postgres-data:
  mysql-data:
