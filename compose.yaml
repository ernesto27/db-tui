name: db-tui

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: chinook
      POSTGRES_USER: db_tui
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U db_tui -d chinook"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s

  postgres-pagila:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pagila
      POSTGRES_USER: db_tui
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - ./docker/postgres/pagila.sql:/docker-entrypoint-initdb.d/001_pagila.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U db_tui -d pagila"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: world
      MYSQL_USER: db_tui
      MYSQL_PASSWORD: db_tui
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --protocol=tcp -h 127.0.0.1 -u db_tui -pdb_tui"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 10s

  oracle:
    image: gvenzl/oracle-free:23-slim
    environment:
      ORACLE_RANDOM_PASSWORD: "true"
      APP_USER: db_tui
      APP_USER_PASSWORD: db_tui
    ports:
      - "127.0.0.1:1522:1521"
    volumes:
      - ./docker/oracle/init:/container-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 2m

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: "DbTuiSql2026!"
    ports:
      - "127.0.0.1:1434:1433"
    healthcheck:
      test: ["CMD-SHELL", '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -No -Q "SELECT 1"']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: "DbTuiSql2026!"
    volumes:
      - ./docker/sqlserver/init/001_sample.sql:/init/001_sample.sql:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >-
        /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "$$MSSQL_SA_PASSWORD" -No -b -i /init/001_sample.sql
    restart: "no"
