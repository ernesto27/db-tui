name: Go tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Start databases
        run: docker compose up -d --wait postgres mysql

      - name: Run tests
        run: go test ./...

      - name: Show database logs on failure
        if: failure()
        run: docker compose logs postgres mysql
